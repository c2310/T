name: Threads Auto Monitor

on:
  schedule:
    # 每 30 分钟自动触发一次 (Cron 语法)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许在网页上点击按钮手动测试触发

# 赋予程序写入保存状态文件的权限
permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行主监控程序
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
        run: python main.py

      - name: 5. 自动保存并更新状态记录
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add threads_state.json
          git diff --staged --quiet || (git commit -m "chore: auto-update state [skip ci]" && git push)
