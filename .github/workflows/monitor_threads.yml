name: Threads Monitor

on:
  schedule:
    # 1. 白天（北京时间 07:00 ~ 00:59 / 对应 UTC 23:00 ~ 16:59）：每 5 分钟运行一次（错峰 2 分钟）
    - cron: '2-57/5 23,0-16 * * *'

    # 2. 夜间（北京时间 01:00 ~ 06:59 / 对应 UTC 17:00 ~ 22:59）：每 15 分钟运行一次（错峰 2 分钟）
    - cron: '2,17,32,47 17-22 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Threads Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python main.py --threads
      - name: Auto Save State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add threads_state.json
          git commit -m "chore: auto-update threads state [skip ci]" || exit 0
          git pull --rebase origin main
          git push
